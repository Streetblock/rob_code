<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoBCode (SVG)</title>
  <link rel="stylesheet" href="style.css">
  <script src="lib/rob-code.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Rings of Bytes</p>
      <h1>Playing with RoBCodes</h1>
    </div>
    <a href="https://github.com/Streetblock/svg_rob_code">Streetblock/svg_rob_code</a>
  </header>

  <main class="workspace">
    <form id="the_form" class="controls">
      <section class="panel text-panel">
        <h2>Content</h2>
        <label for="the_text">Text encoded into the rings</label>
        <textarea id="the_text" name="the_text" rows="16">PUCK
  If we shadows have offended,
  Think but this, and all is mended,
  That you have but slumber'd here
  While these visions did appear.
  And this weak and idle theme,
  No more yielding but a dream,
  Gentles, do not reprehend:
  if you pardon, we will mend:
  And, as I am an honest Puck,
  If we have unearned luck
  Now to 'scape the serpent's tongue,
  We will make amends ere long;
  Else the Puck a liar call;
  So, good night unto you all.
  Give me your hands, if we be friends,
  And Robin shall restore amends.</textarea>
      </section>

      <section class="panel">
        <h2>Ring layout</h2>
        <div class="field-grid">
          <label class="check"><input type="checkbox" name="exponential"> Exponential</label>
          <label>Step size / base
            <select name="step_size">
              <option value="0">0</option><option value="1">1</option>
              <option value="2" selected>2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option>
              <option value="6">6</option><option value="7">7</option><option value="8">8</option>
            </select>
          </label>
          <label>Start ring <input type="number" name="start_ring" value="1"></label>
          <label>Ring width <input type="number" name="ring_width" value="20"></label>
          <label>Bytes per sector <input type="number" name="bytes_per_sector" min="1" value="1"></label>
        </div>
      </section>

      <section class="panel">
        <h2>Encoding</h2>
        <div class="field-grid">
          <label>XOR value <input type="text" name="xor_text" value="0xAA"></label>
          <label class="check"><input type="checkbox" name="xor" checked> Apply XOR</label>
        </div>
        <fieldset>
          <legend>Bit order</legend>
          <label><input type="radio" name="bit_order" value="lsb"> LSB</label>
          <label><input type="radio" name="bit_order" value="msb" checked> MSB</label>
        </fieldset>
        <fieldset>
          <legend>Parity</legend>
          <label><input type="radio" name="parity" value="even" checked> Even</label>
          <label><input type="radio" name="parity" value="odd"> Odd</label>
          <label><input type="radio" name="parity" value="none"> None</label>
          <label><input type="radio" name="parity" value="mark"> Mark</label>
          <label><input type="radio" name="parity" value="space"> Space</label>
        </fieldset>
      </section>

      <section class="panel">
        <h2>Center</h2>
        <div class="radio-grid">
          <label><input type="radio" name="center" value="no_center" checked> No center</label>
          <label><input type="radio" name="center" value="center_circle"> Solid</label>
          <label><input type="radio" name="center" value="ring"> Ring</label>
          <label><input type="radio" name="center" value="double_circle"> Circle with ring</label>
          <label><input type="radio" name="center" value="center_byte"> Center byte</label>
        </div>
        <div class="field-grid">
          <label>Center byte <input type="text" name="center_byte_text" value="0xAA"></label>
          <label>Center X <input type="number" name="center_x" value="250"></label>
          <label>Center Y <input type="number" name="center_y" value="250"></label>
        </div>
      </section>

      <section class="panel">
        <h2>Display</h2>
        <div class="check-grid">
          <label><input type="checkbox" name="counter_clockwise"> Counter-clockwise</label>
          <label><input type="checkbox" name="bounding_circle" checked> Bounding circle</label>
          <label><input type="checkbox" name="colour" checked> Colour</label>
          <label><input type="checkbox" name="unroll"> Unroll</label>
        </div>
        <div class="colour-row" aria-label="Bit colours">
          <input type="color" data-bit-colour value="#ff0000" aria-label="Bit 1 colour">
          <input type="color" data-bit-colour value="#ffb300" aria-label="Bit 2 colour">
          <input type="color" data-bit-colour value="#ffff00" aria-label="Bit 3 colour">
          <input type="color" data-bit-colour value="#00ff00" aria-label="Bit 4 colour">
          <input type="color" data-bit-colour value="#00ffff" aria-label="Bit 5 colour">
          <input type="color" data-bit-colour value="#0000ff" aria-label="Bit 6 colour">
          <input type="color" data-bit-colour value="#7700d8" aria-label="Bit 7 colour">
          <input type="color" data-bit-colour value="#ff00ff" aria-label="Bit 8 colour">
          <input type="color" data-bit-colour value="#000000" aria-label="Parity colour">
          <button type="button" class="secondary" data-action="reverse-colours">Reverse</button>
        </div>
        <button type="submit">Draw RoBCode</button>
      </section>
    </form>

    <section class="preview" aria-label="RoBCode preview">
      <svg id="thesvg" width="100%" height="100%" aria-label="Generated RoBCode"></svg>
    </section>
  </main>
</body>
</html>
